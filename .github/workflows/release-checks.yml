name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the release checker with synthetic defects
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Validate release documents and data
        run: python scripts/check_release.py
